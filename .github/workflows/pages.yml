name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # No `static_site_generator: next` here: that would inject basePath/images.unoptimized and break the image optimizer.
      - uses: actions/configure-pages@v6
        with:
          enablement: true # creates the Pages site (source: GitHub Actions) on first run if the repo does not have one yet
      - run: npm ci
      - name: Resolve where the site is served from
        # The site is served at https://davidgadyan.com (Pages custom domain), so it builds for the root of that domain
        # (basePath ''). The repository variable CUSTOM_DOMAIN overrides the domain; SITE_URL / BASE_PATH remain optional
        # overrides. Set CUSTOM_DOMAIN to "none" to build for https://davitgadyan.github.io/portfolio/ again.
        env:
          DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'davidgadyan.com' }}
        run: |
          if [ -n "$DOMAIN" ] && [ "$DOMAIN" != "none" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=${{ vars.BASE_PATH }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}" >> "$GITHUB_ENV"
            [ -n "${{ vars.SITE_URL }}" ] || echo "NEXT_PUBLIC_SITE_URL=https://$DOMAIN" >> "$GITHUB_ENV"
            echo "CUSTOM_DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=${{ vars.BASE_PATH || '/portfolio' }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'https://davitgadyan.github.io/portfolio' }}" >> "$GITHUB_ENV"
          fi
      - name: Build (static export + image optimisation + checks)
        run: npm run build
        env:
          # GTM_ID (GTM-XXXXXXX) switches tracking to a Tag Manager container; GA_ID / ADS_* are only used without a container.
          VERIFY_STRICT_ES: ${{ vars.VERIFY_STRICT_ES || '' }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID || '' }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID || '' }}
          NEXT_PUBLIC_ADS_ID: ${{ vars.ADS_ID || '' }}
          NEXT_PUBLIC_ADS_LABEL_LEAD: ${{ vars.ADS_LABEL_LEAD || '' }}
          NEXT_PUBLIC_ADS_LABEL_BOOKING: ${{ vars.ADS_LABEL_BOOKING || '' }}
      - run: npm run check:bundle
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
