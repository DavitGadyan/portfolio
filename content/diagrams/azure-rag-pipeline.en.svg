<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-label="A RAG assistant on Azure as a flow of eight boxes: Blob Storage, Document Intelligence, Azure Databricks and Foundry Models for the embeddings on the first row; Azure AI Search, Foundry Models for the answer, Foundry Agent Service and Container Apps on the second row; a band with Entra ID, Key Vault and Azure Monitor across the bottom, and the AWS and Google Cloud equivalents listed under it" style="height:auto;display:block">
  <title>An enterprise RAG assistant on Azure</title>
  <defs><marker id="ar-rag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f" /></marker></defs>
  <rect x="20" y="40" width="160" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="100" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Blob Storage</text>
  <text x="100" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">store the PDFs</text>
  <rect x="200" y="40" width="160" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="280" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Document Intelligence</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">extract text and tables</text>
  <rect x="380" y="40" width="160" height="60" rx="8" fill="#fff1ee" stroke="#FF3621" />
  <text x="460" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Azure Databricks</text>
  <text x="460" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">clean, transform, chunk</text>
  <rect x="560" y="40" width="160" height="60" rx="8" fill="#f1ebfc" stroke="#7B3FE4" />
  <text x="640" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Foundry Models</text>
  <text x="640" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">embeddings</text>
  <line x1="180" y1="70" x2="200" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-rag)" />
  <line x1="360" y1="70" x2="380" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-rag)" />
  <line x1="540" y1="70" x2="560" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-rag)" />
  <path d="M640 100 L640 125 L100 125 L100 150" fill="none" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-rag)" />
  <rect x="20" y="150" width="160" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="100" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Azure AI Search</text>
  <text x="100" y="194" text-anchor="middle" font-size="11" fill="#6f6f6f">store and retrieve vectors</text>
  <rect x="200" y="150" width="160" height="60" rx="8" fill="#f1ebfc" stroke="#7B3FE4" />
  <text x="280" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Foundry Models</text>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#6f6f6f">generate the answer</text>
  <rect x="380" y="150" width="160" height="60" rx="8" fill="#f1ebfc" stroke="#7B3FE4" />
  <text x="460" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Foundry Agent Service</text>
  <text x="460" y="194" text-anchor="middle" font-size="11" fill="#6f6f6f">tools and agent execution</text>
  <rect x="560" y="150" width="160" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="640" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Container Apps</text>
  <text x="640" y="194" text-anchor="middle" font-size="11" fill="#6f6f6f">FastAPI backend</text>
  <line x1="180" y1="180" x2="200" y2="180" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-rag)" />
  <line x1="360" y1="180" x2="380" y2="180" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-rag)" />
  <line x1="540" y1="180" x2="560" y2="180" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-rag)" />
  <rect x="20" y="240" width="700" height="46" rx="8" fill="#f6f6f6" stroke="#cfcfcf" />
  <text x="370" y="259" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Cross-cutting</text>
  <text x="370" y="277" text-anchor="middle" font-size="11" fill="#6f6f6f">Entra ID (authentication) · Key Vault (secrets) · Azure Monitor (performance and cost)</text>
  <text x="20" y="320" font-size="12" fill="#6f6f6f">AWS: S3 · Textract · Glue · Bedrock · OpenSearch · ECS on Fargate</text>
  <text x="20" y="342" font-size="12" fill="#6f6f6f">Google Cloud: Cloud Storage · Document AI · Dataflow or Dataproc · Gemini Enterprise Agent Platform · BigQuery · Cloud Run</text>
  <text x="20" y="378" font-size="12" fill="#6f6f6f">Foundry owns the model, the agent and the evaluation; the rest stays on other Azure services.</text>
</svg>
