<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" role="img" aria-label="An agent loop: a user task goes to a planner, a reasoning model such as Claude Opus 5.5 or GPT-6 Sol, which drafts a tool call; a gate run by Microsoft Decision-1 asks whether the call is within policy and whether it needs approval; if yes it runs as a tool call through MCP or an API, if not it goes to human approval; a check run by Microsoft Decision-1 then asks whether the step succeeded and returns continue or retry to the planner, or escalate to the person. A band underneath compares the cost of one planner call per step with two decision calls per step" style="height:auto;display:block">
  <title>Where a decision model sits in an agent loop</title>
  <defs><marker id="ar-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f" /></marker></defs>
  <rect x="20" y="40" width="140" height="60" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="90" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">User task</text>
  <text x="90" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">goal and context</text>
  <rect x="195" y="40" width="170" height="60" rx="8" fill="#f1ebfc" stroke="#7B3FE4" />
  <text x="280" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Planner: reasoning LLM</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">Claude Opus 5.5 or GPT-6 Sol</text>
  <rect x="395" y="40" width="160" height="60" rx="8" fill="#fff1ee" stroke="#FF3621" />
  <text x="475" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Gate: Decision-1</text>
  <text x="475" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">in policy? needs approval?</text>
  <rect x="595" y="40" width="145" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="667" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Tool call</text>
  <text x="667" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">MCP tool, API, database</text>
  <line x1="160" y1="70" x2="195" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop)" />
  <line x1="365" y1="70" x2="395" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop)" />
  <line x1="555" y1="70" x2="595" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop)" />
  <text x="575" y="62" text-anchor="middle" font-size="10" fill="#6f6f6f">yes</text>
  <rect x="395" y="160" width="160" height="60" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="475" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Human approval</text>
  <text x="475" y="204" text-anchor="middle" font-size="11" fill="#6f6f6f">pause, approve, resume</text>
  <line x1="475" y1="100" x2="475" y2="160" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop)" />
  <text x="487" y="134" font-size="10" fill="#6f6f6f">no, or needs approval</text>
  <rect x="595" y="160" width="145" height="70" rx="8" fill="#fff1ee" stroke="#FF3621" />
  <text x="667" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Check: Decision-1</text>
  <text x="667" y="202" text-anchor="middle" font-size="11" fill="#6f6f6f">succeeded? continue,</text>
  <text x="667" y="218" text-anchor="middle" font-size="11" fill="#6f6f6f">retry or escalate</text>
  <line x1="667" y1="100" x2="667" y2="160" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop)" />
  <text x="679" y="134" font-size="10" fill="#6f6f6f">result</text>
  <line x1="595" y1="190" x2="555" y2="190" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop)" />
  <text x="575" y="181" text-anchor="middle" font-size="10" fill="#6f6f6f">escalate</text>
  <path d="M667 230 L667 255 L280 255 L280 100" fill="none" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop)" />
  <text x="473" y="269" text-anchor="middle" font-size="10" fill="#6f6f6f">continue or retry: back to the planner with the result</text>
  <rect x="20" y="290" width="720" height="44" rx="8" fill="#f6f6f6" stroke="#cfcfcf" />
  <text x="380" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Per step: one planner call at dollars per million tokens and two decision calls at $0.042 per million.</text>
  <text x="380" y="326" text-anchor="middle" font-size="11" fill="#6f6f6f">Thirty steps a run: the gates and checks cost cents; the planner is the bill.</text>
  <text x="20" y="366" font-size="12" fill="#6f6f6f">State checkpoints in PostgreSQL or Redis let a run wait for a person and resume where it stopped.</text>
  <text x="20" y="388" font-size="12" fill="#6f6f6f">Every decision, its probabilities and its cost land in the same OpenTelemetry trace as the planner's calls.</text>
</svg>
