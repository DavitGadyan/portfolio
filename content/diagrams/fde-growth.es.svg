<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="100%" role="img" aria-label="Crecimiento publicado de ofertas de FDE (%): Paraform, T1 2025 → T1 2026 +350%; FT / Indeed, ene → sep 2025 +800%; Lightcast, ene–ago 2026 vs 2025 +1.000%; Bloomberry, ene–oct 2025 vs 2024 +1.165%; Todas las ofertas tech (Lightcast) +13%" style="height:auto;display:block">
  <title>Crecimiento publicado de ofertas de FDE (%)</title>
  <text x="380.0" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#313131">Crecimiento publicado de ofertas de FDE (%)</text>
  <text x="238" y="71" text-anchor="end" font-size="12.5" fill="#313131">Paraform, T1 2025 → T1 2026</text>
  <rect x="250" y="56" width="117.2" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="375.2" y="72" font-size="12.5" font-weight="600" fill="#313131">+350%</text>
  <text x="238" y="111" text-anchor="end" font-size="12.5" fill="#313131">FT / Indeed, ene → sep 2025</text>
  <rect x="250" y="96" width="267.8" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="525.8" y="112" font-size="12.5" font-weight="600" fill="#313131">+800%</text>
  <text x="238" y="151" text-anchor="end" font-size="12.5" fill="#313131">Lightcast, ene–ago 2026 vs 2025</text>
  <rect x="250" y="136" width="334.8" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="592.8" y="152" font-size="12.5" font-weight="600" fill="#313131">+1.000%</text>
  <text x="238" y="191" text-anchor="end" font-size="12.5" fill="#313131">Bloomberry, ene–oct 2025 vs 2024</text>
  <rect x="250" y="176" width="390.0" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="648.0" y="192" font-size="12.5" font-weight="600" fill="#313131">+1.165%</text>
  <text x="238" y="231" text-anchor="end" font-size="12.5" fill="#313131">Todas las ofertas tech (Lightcast)</text>
  <rect x="250" y="216" width="4.4" height="24" rx="4" fill="#f3ecfb" stroke="#6D28D9" />
  <text x="262.4" y="232" font-size="12.5" font-weight="600" fill="#313131">+13%</text>
  <text x="380.0" y="284" text-anchor="middle" font-size="11.5" fill="#6f6f6f">Cada fuente usa sus propios datos y periodo, por eso las cifras difieren. FT y Lightcast dicen "más de".</text>
</svg>
