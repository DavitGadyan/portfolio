<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" role="img" aria-label="Un flujo de decisión con cuatro preguntas a la izquierda y una respuesta a la derecha de cada una: un conjunto fijo de respuestas, como clasificar, enrutar o calificar, lleva a Microsoft Decision-1; datos que deben quedarse en hardware que controlas llevan a pesos abiertos en vLLM como Qwen3.8-27B, DeepSeek-V4, Llama 4 y Mistral; imágenes, vídeo o conjuntos de documentos muy grandes llevan a Gemini 4 Argon; programación agéntica larga o razonamiento difícil lleva a Claude Opus 5.5, Claude Fable 5.1 o GPT-6 Astra; en otro caso, una gama media como Claude Sonnet 5.5, GPT-6.1 Terra, Gemini 3.8 Flash o Qwen3.8-Flash, probada con tus propios documentos" style="height:auto;display:block">
  <title>Qué modelo primero: un flujo de decisión</title>
  <defs><marker id="ar-llm-es" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f" /></marker></defs>
  <rect x="20" y="20" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">¿Respuestas fijas: clasificar, enrutar o calificar?</text>
  <rect x="430" y="20" width="310" height="56" rx="8" fill="#fff1ee" stroke="#FF3621" />
  <text x="585" y="43" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Microsoft Decision-1</text>
  <text x="585" y="63" text-anchor="middle" font-size="11" fill="#6f6f6f">una probabilidad por opción, céntimos por millón</text>
  <line x1="400" y1="48" x2="430" y2="48" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="415" y="42" text-anchor="middle" font-size="10" fill="#6f6f6f">sí</text>
  <line x1="210" y1="76" x2="210" y2="110" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="222" y="97" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="110" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">¿Los datos deben quedarse en tu hardware?</text>
  <rect x="430" y="110" width="310" height="56" rx="8" fill="#e9f6f0" stroke="#1E7F5C" />
  <text x="585" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Pesos abiertos en vLLM u Ollama</text>
  <text x="585" y="153" text-anchor="middle" font-size="11" fill="#6f6f6f">Qwen3.8-27B, DeepSeek-V4, Llama 4, Mistral</text>
  <line x1="400" y1="138" x2="430" y2="138" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="415" y="132" text-anchor="middle" font-size="10" fill="#6f6f6f">sí</text>
  <line x1="210" y1="166" x2="210" y2="200" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="222" y="187" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="200" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">¿Imágenes, vídeo o documentos enormes?</text>
  <rect x="430" y="200" width="310" height="56" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="585" y="223" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Gemini 4 Argon</text>
  <text x="585" y="243" text-anchor="middle" font-size="11" fill="#6f6f6f">multimodal; ventana de 1.048.576 tokens</text>
  <line x1="400" y1="228" x2="430" y2="228" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="415" y="222" text-anchor="middle" font-size="10" fill="#6f6f6f">sí</text>
  <line x1="210" y1="256" x2="210" y2="290" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="222" y="277" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="290" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">¿Código agéntico largo o razonamiento difícil?</text>
  <rect x="430" y="290" width="310" height="56" rx="8" fill="#f1ebfc" stroke="#7B3FE4" />
  <text x="585" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Claude Opus 5.5 o Fable 5.1, GPT-6 Astra</text>
  <text x="585" y="333" text-anchor="middle" font-size="11" fill="#6f6f6f">gama alta; prueba antes la gama media</text>
  <line x1="400" y1="318" x2="430" y2="318" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="415" y="312" text-anchor="middle" font-size="10" fill="#6f6f6f">sí</text>
  <line x1="210" y1="346" x2="210" y2="380" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-llm-es)" />
  <text x="222" y="367" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="380" width="720" height="46" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="380" y="399" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">En otro caso: gama media. Claude Sonnet 5.5, GPT-6.1 Terra, Gemini 3.8 Flash o Qwen3.8-Flash</text>
  <text x="380" y="417" text-anchor="middle" font-size="11" fill="#6f6f6f">una quinta parte del precio o menos; la misma ventana en la mayoría de los casos</text>
  <text x="380" y="458" text-anchor="middle" font-size="12" fill="#6f6f6f">Señales en tiempo real: Grok 4.7. Sea cual sea la rama, prueba dos candidatos con el mismo conjunto de pruebas.</text>
  <text x="380" y="480" text-anchor="middle" font-size="12" fill="#6f6f6f">Nombres de modelo y precios según los publicaron los proveedores el 6 de noviembre de 2026; cambian cada mes.</text>
</svg>
