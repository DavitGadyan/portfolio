<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="100%" role="img" aria-label="Reported growth in FDE job postings (%): Paraform, Q1 2025 → Q1 2026 +350%; FT / Indeed, Jan → Sep 2025 +800%; Lightcast, Jan–Aug 2026 vs 2025 +1,000%; Bloomberry, Jan–Oct 2025 vs 2024 +1,165%; All tech postings (Lightcast) +13%" style="height:auto;display:block">
  <title>Reported growth in FDE job postings (%)</title>
  <text x="380.0" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#313131">Reported growth in FDE job postings (%)</text>
  <text x="238" y="71" text-anchor="end" font-size="12.5" fill="#313131">Paraform, Q1 2025 → Q1 2026</text>
  <rect x="250" y="56" width="117.2" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="375.2" y="72" font-size="12.5" font-weight="600" fill="#313131">+350%</text>
  <text x="238" y="111" text-anchor="end" font-size="12.5" fill="#313131">FT / Indeed, Jan → Sep 2025</text>
  <rect x="250" y="96" width="267.8" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="525.8" y="112" font-size="12.5" font-weight="600" fill="#313131">+800%</text>
  <text x="238" y="151" text-anchor="end" font-size="12.5" fill="#313131">Lightcast, Jan–Aug 2026 vs 2025</text>
  <rect x="250" y="136" width="334.8" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="592.8" y="152" font-size="12.5" font-weight="600" fill="#313131">+1,000%</text>
  <text x="238" y="191" text-anchor="end" font-size="12.5" fill="#313131">Bloomberry, Jan–Oct 2025 vs 2024</text>
  <rect x="250" y="176" width="390.0" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="648.0" y="192" font-size="12.5" font-weight="600" fill="#313131">+1,165%</text>
  <text x="238" y="231" text-anchor="end" font-size="12.5" fill="#313131">All tech postings (Lightcast)</text>
  <rect x="250" y="216" width="4.4" height="24" rx="4" fill="#f3ecfb" stroke="#6D28D9" />
  <text x="262.4" y="232" font-size="12.5" font-weight="600" fill="#313131">+13%</text>
  <text x="380.0" y="284" text-anchor="middle" font-size="11.5" fill="#6f6f6f">Each source uses its own data and time window, so the figures differ. FT and Lightcast say "more than".</text>
</svg>
