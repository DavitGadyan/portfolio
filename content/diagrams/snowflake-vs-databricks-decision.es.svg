<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="100%" role="img" aria-label="Flujo de decisión. ¿Qué domina la carga de trabajo? Sobre todo analítica SQL, BI, muchos usuarios y datos compartidos lleva a Snowflake. Si no, sobre todo código Spark, ML a medida y archivos en tu propio lago lleva a Databricks. Si no, usa ambos y reparte por carga de trabajo, conservando formatos de tabla abiertos para que cada lado pueda leer al otro" style="height:auto;display:block">
  <title>Qué plataforma para qué carga de trabajo</title>
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6f6f" />
    </marker>
  </defs>
  <rect x="260" y="12" width="240" height="40" rx="20" fill="#313131" />
  <text x="380" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">¿Qué domina la carga de trabajo?</text>
  <line x1="380" y1="52" x2="380" y2="80" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#arrow-head)" />
  <rect x="170" y="82" width="420" height="50" rx="8" fill="#f6f6f6" stroke="#cfcfcf" />
  <text x="380" y="112" text-anchor="middle" font-size="13" fill="#313131">¿Sobre todo analítica SQL, BI, muchos usuarios, datos compartidos?</text>
  <polyline points="170,107 110,107 110,252" fill="none" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#arrow-head)" />
  <text x="118" y="180" font-size="12" fill="#6f6f6f">sí</text>
  <line x1="380" y1="132" x2="380" y2="166" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#arrow-head)" />
  <text x="388" y="154" font-size="12" fill="#6f6f6f">no</text>
  <rect x="170" y="168" width="420" height="50" rx="8" fill="#f6f6f6" stroke="#cfcfcf" />
  <text x="380" y="198" text-anchor="middle" font-size="13" fill="#313131">¿Sobre todo código Spark, ML a medida, archivos en tu lago?</text>
  <polyline points="590,193 650,193 650,252" fill="none" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#arrow-head)" />
  <text x="626" y="226" font-size="12" fill="#6f6f6f">sí</text>
  <line x1="380" y1="218" x2="380" y2="252" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#arrow-head)" />
  <text x="388" y="240" font-size="12" fill="#6f6f6f">no</text>
  <rect x="10" y="254" width="200" height="60" rx="8" fill="#e9f7fd" stroke="#29B5E8" stroke-width="1.5" />
  <text x="110" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#29B5E8">Snowflake</text>
  <text x="110" y="300" text-anchor="middle" font-size="12" fill="#313131">almacenes, Cortex, shares</text>
  <rect x="230" y="254" width="300" height="60" rx="8" fill="#eef8f1" stroke="#1faa55" stroke-width="1.5" />
  <text x="380" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#1faa55">Ambos, repartidos por carga</text>
  <text x="380" y="300" text-anchor="middle" font-size="12" fill="#313131">formatos abiertos: cada uno lee al otro</text>
  <rect x="550" y="254" width="200" height="60" rx="8" fill="#fff1ee" stroke="#FF3621" stroke-width="1.5" />
  <text x="650" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#FF3621">Databricks</text>
  <text x="650" y="300" text-anchor="middle" font-size="12" fill="#313131">Spark, Delta Lake, MLflow</text>
</svg>
