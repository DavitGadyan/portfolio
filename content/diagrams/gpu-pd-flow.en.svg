<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-label="Request flow: the client sends a prompt to the router, which sends it to the prefill pool; the KV cache moves over RDMA to the decode pool, which streams tokens back to the client" style="height:auto;display:block">
  <title>Prefill and decode request flow</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f"/></marker></defs>
  <rect x="20" y="110" width="100" height="80" rx="8" fill="#f6f6f6" stroke="#9a9a9a" />
  <text x="70" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Client</text>
  <text x="70" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#6f6f6f">prompt</text>
  <rect x="150" y="110" width="110" height="80" rx="8" fill="#f6f6f6" stroke="#9a9a9a" />
  <text x="205" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Router</text>
  <text x="205" y="165" text-anchor="middle" font-size="11" font-weight="400" fill="#6f6f6f">KV-aware</text>
  <rect x="300" y="60" width="170" height="180" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="385" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Prefill pool</text>
  <text x="385" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Reads the whole prompt</text>
  <text x="385" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Compute-bound</text>
  <text x="385" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Builds the KV cache</text>
  <text x="385" y="184" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Sets time to first token</text>
  <rect x="560" y="60" width="180" height="180" rx="8" fill="#e9f6f0" stroke="#1E7F5C" />
  <text x="650" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Decode pool</text>
  <text x="650" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Generates token by token</text>
  <text x="650" y="140" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Memory-bandwidth-bound</text>
  <text x="650" y="162" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Reads and grows the KV cache</text>
  <text x="650" y="184" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Sets time between tokens</text>
  <line x1="120" y1="150" x2="148" y2="150" stroke="#6f6f6f" stroke-width="2" marker-end="url(#a)" />
  <line x1="260" y1="150" x2="298" y2="150" stroke="#6f6f6f" stroke-width="2" marker-end="url(#a)" />
  <line x1="470" y1="150" x2="558" y2="150" stroke="#B25E09" stroke-width="2" marker-end="url(#a)" />
  <text x="514" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#B25E09">KV cache</text>
  <text x="514" y="176" text-anchor="middle" font-size="11" font-weight="600" fill="#B25E09">RDMA</text>
  <path d="M650 240 L650 285 L70 285 L70 192" fill="none" stroke="#6f6f6f" stroke-width="2" marker-end="url(#a)" />
  <text x="360" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Tokens streamed back to the client</text>
</svg>
