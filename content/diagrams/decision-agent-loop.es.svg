<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" role="img" aria-label="Un bucle de agente: una tarea del usuario va a un planificador, un modelo de razonamiento como Claude Opus 5.5 o GPT-6 Sol, que redacta una llamada a herramienta; un control ejecutado por Microsoft Decision-1 pregunta si la llamada está dentro de la política y si necesita aprobación; si sí, se ejecuta como llamada a herramienta por MCP o una API, si no, va a aprobación humana; después una comprobación ejecutada por Microsoft Decision-1 pregunta si el paso ha tenido éxito y devuelve continuar o reintentar al planificador, o escalar a la persona. Una banda debajo compara el coste de una llamada al planificador por paso con dos llamadas de decisión por paso" style="height:auto;display:block">
  <title>Dónde se coloca un modelo de decisión en un bucle de agente</title>
  <defs><marker id="ar-loop-es" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f" /></marker></defs>
  <rect x="20" y="40" width="140" height="60" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="90" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Tarea del usuario</text>
  <text x="90" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">objetivo y contexto</text>
  <rect x="195" y="40" width="170" height="60" rx="8" fill="#f1ebfc" stroke="#7B3FE4" />
  <text x="280" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Planificador (LLM)</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">Claude Opus 5.5 o GPT-6 Sol</text>
  <rect x="395" y="40" width="160" height="60" rx="8" fill="#fff1ee" stroke="#FF3621" />
  <text x="475" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Control: Decision-1</text>
  <text x="475" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">¿política? ¿aprobación?</text>
  <rect x="595" y="40" width="145" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="667" y="64" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Herramienta</text>
  <text x="667" y="84" text-anchor="middle" font-size="11" fill="#6f6f6f">MCP, API, base de datos</text>
  <line x1="160" y1="70" x2="195" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop-es)" />
  <line x1="365" y1="70" x2="395" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop-es)" />
  <line x1="555" y1="70" x2="595" y2="70" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop-es)" />
  <text x="575" y="62" text-anchor="middle" font-size="10" fill="#6f6f6f">sí</text>
  <rect x="395" y="160" width="160" height="60" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="475" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Aprobación humana</text>
  <text x="475" y="204" text-anchor="middle" font-size="11" fill="#6f6f6f">se pausa y se reanuda</text>
  <line x1="475" y1="100" x2="475" y2="160" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop-es)" />
  <text x="487" y="134" font-size="10" fill="#6f6f6f">no, o necesita aprobación</text>
  <rect x="595" y="160" width="145" height="70" rx="8" fill="#fff1ee" stroke="#FF3621" />
  <text x="667" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Revisión: Decision-1</text>
  <text x="667" y="202" text-anchor="middle" font-size="11" fill="#6f6f6f">¿éxito? continuar,</text>
  <text x="667" y="218" text-anchor="middle" font-size="11" fill="#6f6f6f">reintentar o escalar</text>
  <line x1="667" y1="100" x2="667" y2="160" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop-es)" />
  <text x="679" y="134" font-size="10" fill="#6f6f6f">resultado</text>
  <line x1="595" y1="190" x2="555" y2="190" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop-es)" />
  <text x="575" y="181" text-anchor="middle" font-size="10" fill="#6f6f6f">escalar</text>
  <path d="M667 230 L667 255 L280 255 L280 100" fill="none" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-loop-es)" />
  <text x="473" y="269" text-anchor="middle" font-size="10" fill="#6f6f6f">continuar o reintentar: vuelta al planificador con el resultado</text>
  <rect x="20" y="290" width="720" height="44" rx="8" fill="#f6f6f6" stroke="#cfcfcf" />
  <text x="380" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Por paso: un planificador a dólares por millón y dos decisiones a 0,042 $ por millón, salida gratis.</text>
  <text x="380" y="326" text-anchor="middle" font-size="11" fill="#6f6f6f">Treinta pasos por ejecución: los controles cuestan céntimos; el planificador es la factura.</text>
  <text x="20" y="366" font-size="12" fill="#6f6f6f">Los puntos de control en PostgreSQL o Redis permiten pausar una ejecución ante una persona y reanudarla.</text>
  <text x="20" y="388" font-size="12" fill="#6f6f6f">Cada decisión, sus probabilidades y su coste acaban en la misma traza de OpenTelemetry que el planificador.</text>
</svg>
