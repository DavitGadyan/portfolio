<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 258" width="100%" role="img" aria-label="Coste medio mundial de una brecha de datos, millones de USD: 2024 4,88 M$; 2025 4,44 M$; 2026 4,99 M$; 2026, ataques con IA 6,00 M$" style="height:auto;display:block">
  <title>Coste medio mundial de una brecha de datos, millones de USD</title>
  <text x="380.0" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#313131">Coste medio mundial de una brecha de datos, millones de USD</text>
  <text x="238" y="71" text-anchor="end" font-size="12.5" fill="#313131">2024</text>
  <rect x="250" y="56" width="317.2" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="575.2" y="72" font-size="12.5" font-weight="600" fill="#313131">4,88 M$</text>
  <text x="238" y="111" text-anchor="end" font-size="12.5" fill="#313131">2025</text>
  <rect x="250" y="96" width="288.6" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="546.6" y="112" font-size="12.5" font-weight="600" fill="#313131">4,44 M$</text>
  <text x="238" y="151" text-anchor="end" font-size="12.5" fill="#313131">2026</text>
  <rect x="250" y="136" width="324.4" height="24" rx="4" fill="#e8f2fb" stroke="#0078D4" />
  <text x="582.4" y="152" font-size="12.5" font-weight="600" fill="#313131">4,99 M$</text>
  <text x="238" y="191" text-anchor="end" font-size="12.5" fill="#313131">2026, ataques con IA</text>
  <rect x="250" y="176" width="390.0" height="24" rx="4" fill="#f3ecfb" stroke="#6D28D9" />
  <text x="648.0" y="192" font-size="12.5" font-weight="600" fill="#313131">6,00 M$</text>
  <text x="380.0" y="244" text-anchor="middle" font-size="11.5" fill="#6f6f6f">Informes Cost of a Data Breach de IBM, 2024 a 2026. En 2026, 1 de cada 4 brechas maliciosas usó IA.</text>
</svg>
