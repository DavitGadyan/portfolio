<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 310" width="100%" role="img" aria-label="Helm instala el router y los pools de prefill y decode en Kubernetes; el router elige un pod de prefill, el KV cache pasa a un pod de decode y los tokens vuelven al cliente" style="height:auto;display:block">
  <title>Helm, router y pools de prefill/decode</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f"/></marker></defs>
  <rect x="20" y="20" width="150" height="56" rx="8" fill="#fff4e5" stroke="#d9822b" />
  <text x="95.0" y="42.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Helm + values.yaml</text>
  <text x="95.0" y="60.0" text-anchor="middle" font-size="11" fill="#6f6f6f">helm install / upgrade</text>
  <line x1="170" y1="48" x2="230" y2="48" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="230" y="20" width="150" height="56" rx="8" fill="#fff4e5" stroke="#d9822b" />
  <text x="305.0" y="52.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">API de Kubernetes</text>
  <rect x="20" y="150" width="100" height="60" rx="8" fill="#f6f6f6" stroke="#9a9a9a" />
  <text x="70.0" y="174.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Cliente</text>
  <text x="70.0" y="192.0" text-anchor="middle" font-size="11" fill="#6f6f6f">prompt</text>
  <line x1="120" y1="180" x2="150" y2="180" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="150" y="150" width="100" height="60" rx="8" fill="#f6f6f6" stroke="#9a9a9a" />
  <text x="200.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Gateway</text>
  <line x1="250" y1="180" x2="280" y2="180" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="280" y="150" width="110" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="335.0" y="174.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Router / EPP</text>
  <text x="335.0" y="192.0" text-anchor="middle" font-size="11" fill="#6f6f6f">elige un pod</text>
  <line x1="390" y1="170" x2="430" y2="120" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="430" y="90" width="170" height="60" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="515.0" y="114.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Pods de prefill</text>
  <text x="515.0" y="132.0" text-anchor="middle" font-size="11" fill="#6f6f6f">vLLM, limitados por cómputo</text>
  <line x1="390" y1="190" x2="430" y2="250" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="430" y="220" width="170" height="60" rx="8" fill="#e9f6ec" stroke="#2e8b57" />
  <text x="515.0" y="244.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Pods de decode</text>
  <text x="515.0" y="262.0" text-anchor="middle" font-size="11" fill="#6f6f6f">vLLM, limitados por memoria</text>
  <line x1="515" y1="150" x2="515" y2="220" stroke="#d9822b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="525" y="190" font-size="11" fill="#6f6f6f">El KV cache viaja por RDMA (NIXL)</text>
  <line x1="380" y1="48" x2="515" y2="48" stroke="#9a9a9a" stroke-dasharray="3 3"/><line x1="515" y1="48" x2="515" y2="90" stroke="#9a9a9a" stroke-dasharray="3 3"/>
  <line x1="600" y1="250" x2="640" y2="250" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="640" y="220" width="110" height="60" rx="8" fill="#f6f6f6" stroke="#9a9a9a" />
  <text x="695.0" y="244.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Cliente</text>
  <text x="695.0" y="262.0" text-anchor="middle" font-size="11" fill="#6f6f6f">tokens</text>
</svg>
