<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" role="img" aria-label="A decision flow with four questions down the left and an answer to the right of each: an LLM app, RAG or agent leads to Microsoft Foundry with Azure AI Search; mostly SQL analytics, BI and Microsoft 365 users leads to Microsoft Fabric with Power BI; heavy Spark, custom ML and compute you configure leads to Azure Databricks; a classic ML lifecycle leads to Azure Machine Learning; otherwise plain Azure services and your own code" style="height:auto;display:block">
  <title>Which Microsoft service: a decision flow</title>
  <defs><marker id="ar-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f" /></marker></defs>
  <rect x="20" y="20" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Is the work an LLM app, RAG or an agent?</text>
  <rect x="430" y="20" width="310" height="56" rx="8" fill="#f1ebfc" stroke="#7B3FE4" />
  <text x="585" y="43" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Microsoft Foundry</text>
  <text x="585" y="63" text-anchor="middle" font-size="12" fill="#6f6f6f">plus Azure AI Search for the retrieval</text>
  <line x1="400" y1="48" x2="430" y2="48" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="415" y="42" text-anchor="middle" font-size="10" fill="#6f6f6f">yes</text>
  <line x1="210" y1="76" x2="210" y2="110" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="222" y="97" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="110" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="143" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Mostly SQL analytics, BI and Microsoft 365 users?</text>
  <rect x="430" y="110" width="310" height="56" rx="8" fill="#e9f6f0" stroke="#1E7F5C" />
  <text x="585" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Microsoft Fabric</text>
  <text x="585" y="153" text-anchor="middle" font-size="12" fill="#6f6f6f">plus Power BI; OneLake as the shared lake</text>
  <line x1="400" y1="138" x2="430" y2="138" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="415" y="132" text-anchor="middle" font-size="10" fill="#6f6f6f">yes</text>
  <line x1="210" y1="166" x2="210" y2="200" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="222" y="187" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="200" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Heavy Spark, custom ML, compute you configure?</text>
  <rect x="430" y="200" width="310" height="56" rx="8" fill="#fff1ee" stroke="#FF3621" />
  <text x="585" y="223" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Azure Databricks</text>
  <text x="585" y="243" text-anchor="middle" font-size="12" fill="#6f6f6f">Delta Lake, Unity Catalog, MLflow</text>
  <line x1="400" y1="228" x2="430" y2="228" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="415" y="222" text-anchor="middle" font-size="10" fill="#6f6f6f">yes</text>
  <line x1="210" y1="256" x2="210" y2="290" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="222" y="277" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="290" width="380" height="56" rx="8" fill="#f6f6f6" stroke="#999999" />
  <text x="210" y="323" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">A classic ML lifecycle, no Spark needed?</text>
  <rect x="430" y="290" width="310" height="56" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="585" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Azure Machine Learning</text>
  <text x="585" y="333" text-anchor="middle" font-size="12" fill="#6f6f6f">training, model registry, endpoints</text>
  <line x1="400" y1="318" x2="430" y2="318" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="415" y="312" text-anchor="middle" font-size="10" fill="#6f6f6f">yes</text>
  <line x1="210" y1="346" x2="210" y2="380" stroke="#6f6f6f" stroke-width="1.5" marker-end="url(#ar-dec)" />
  <text x="222" y="367" font-size="10" fill="#6f6f6f">no</text>
  <rect x="20" y="380" width="720" height="40" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="380" y="405" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Otherwise: plain Azure services, Container Apps, Azure SQL, Functions, and your own code</text>
  <text x="380" y="440" text-anchor="middle" font-size="12" fill="#6f6f6f">Already on Databricks? Add Fabric only for Power BI users. Already have LangGraph? Run it as a Foundry hosted agent.</text>
</svg>
