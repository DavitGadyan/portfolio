<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="100%" role="img" aria-label="Four layers: llm-d on Kubernetes orchestrates, Triton serves, vLLM, TensorRT-LLM or SGLang run the model, GPUs execute" style="height:auto;display:block">
  <title>The serving stack in four layers</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f"/></marker></defs>
  <rect x="20" y="30" width="720" height="64" rx="8" fill="#fff4e5" stroke="#d9822b" />
  <text x="380.0" y="56.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Orchestration on Kubernetes</text>
  <text x="380.0" y="74.0" text-anchor="middle" font-size="11" fill="#6f6f6f">llm-d: KV-aware router, prefill and decode pools</text>
  <rect x="20" y="126" width="720" height="64" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="380.0" y="152.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Serving layer</text>
  <text x="380.0" y="170.0" text-anchor="middle" font-size="11" fill="#6f6f6f">Triton Inference Server: HTTP/gRPC, batching, metrics, ensembles</text>
  <text x="20" y="226" font-size="11" fill="#6f6f6f">Inference engine</text>
  <rect x="20" y="236" width="220" height="56" rx="8" fill="#e9f6ec" stroke="#2e8b57" />
  <text x="130.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">vLLM</text>
  <rect x="270" y="236" width="220" height="56" rx="8" fill="#e9f6ec" stroke="#2e8b57" />
  <text x="380.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">TensorRT-LLM</text>
  <rect x="520" y="236" width="220" height="56" rx="8" fill="#e9f6ec" stroke="#2e8b57" />
  <text x="630.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">SGLang</text>
  <rect x="20" y="318" width="720" height="52" rx="8" fill="#f6f6f6" stroke="#9a9a9a" />
  <text x="380.0" y="338.0" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Hardware</text>
  <text x="380.0" y="356.0" text-anchor="middle" font-size="11" fill="#6f6f6f">NVIDIA GPUs (all three), AMD GPUs and CPUs (vLLM), TPU and others (SGLang)</text>
  <text x="744" y="52" text-anchor="end" font-size="11" fill="#6f6f6f"></text>
  <text x="380" y="214" text-anchor="middle" font-size="11" fill="#6f6f6f">hosts TRT-LLM and vLLM backends</text>
  <text x="380" y="100" font-size="0"></text>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="#6f6f6f"></text>
  <text x="380" y="112" text-anchor="middle" font-size="11" fill="#6f6f6f">runs vLLM and SGLang</text>
</svg>
