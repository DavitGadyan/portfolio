<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" role="img" aria-label="Montaje en Kubernetes: los nodos de CPU alojan el ingress, el router según KV y el autoescalador; el router envía peticiones a un grupo de prefill de nodos GPU con pods de 4 GPU y a un grupo de decode de nodos GPU con pods de 2 GPU; la caché KV pasa entre los grupos por RDMA; una release de Helm lo define todo" style="height:auto;display:block">
  <title>Topología de prefill y decode en Kubernetes</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6f6f"/></marker></defs>
  <rect x="20" y="20" width="720" height="86" rx="8" fill="#f6f6f6" stroke="#9a9a9a" />
  <text x="380" y="42" text-anchor="middle" font-size="12" font-weight="600" fill="#6f6f6f">Nodos de CPU</text>
  <rect x="50" y="54" width="180" height="40" rx="8" fill="#ffffff" stroke="#9a9a9a" />
  <text x="140" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Ingress / AI gateway</text>
  <rect x="290" y="54" width="180" height="40" rx="8" fill="#ffffff" stroke="#9a9a9a" />
  <text x="380" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Router (según KV)</text>
  <rect x="530" y="54" width="180" height="40" rx="8" fill="#ffffff" stroke="#9a9a9a" />
  <text x="620" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Autoescalador (HPA / KEDA)</text>
  <rect x="20" y="150" width="330" height="190" rx="8" fill="#e8f2fb" stroke="#0078D4" />
  <text x="185" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Grupo de prefill</text>
  <text x="185" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#6f6f6f">Nodos GPU, etiqueta role=prefill</text>
  <rect x="45" y="208" width="130" height="60" rx="8" fill="#ffffff" stroke="#0078D4" />
  <text x="110" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Pod 1</text>
  <text x="110" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">4 GPU · TP=4</text>
  <rect x="195" y="208" width="130" height="60" rx="8" fill="#ffffff" stroke="#0078D4" />
  <text x="260" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Pod 2</text>
  <text x="260" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">4 GPU · TP=4</text>
  <text x="185" y="295" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">Pocos pods grandes, intensivos en cómputo</text>
  <text x="185" y="313" text-anchor="middle" font-size="11" font-weight="400" fill="#6f6f6f">nvidia.com/gpu: 4 por pod</text>
  <rect x="410" y="150" width="330" height="190" rx="8" fill="#e9f6f0" stroke="#1E7F5C" />
  <text x="575" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="#313131">Grupo de decode</text>
  <text x="575" y="192" text-anchor="middle" font-size="11" font-weight="400" fill="#6f6f6f">Nodos GPU, etiqueta role=decode</text>
  <rect x="425" y="208" width="90" height="60" rx="8" fill="#ffffff" stroke="#1E7F5C" />
  <text x="470" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Pod 1</text>
  <text x="470" y="250" text-anchor="middle" font-size="10" font-weight="400" fill="#313131">2 GPU · TP=2</text>
  <rect x="525" y="208" width="90" height="60" rx="8" fill="#ffffff" stroke="#1E7F5C" />
  <text x="570" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Pod 2</text>
  <text x="570" y="250" text-anchor="middle" font-size="10" font-weight="400" fill="#313131">2 GPU · TP=2</text>
  <rect x="625" y="208" width="90" height="60" rx="8" fill="#ffffff" stroke="#1E7F5C" />
  <text x="670" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Pod 3</text>
  <text x="670" y="250" text-anchor="middle" font-size="10" font-weight="400" fill="#313131">2 GPU · TP=2</text>
  <text x="575" y="295" text-anchor="middle" font-size="11" font-weight="400" fill="#313131">6 pods en el ejemplo (se ven 3), intensivos en memoria</text>
  <text x="575" y="313" text-anchor="middle" font-size="11" font-weight="400" fill="#6f6f6f">nvidia.com/gpu: 2 por pod</text>
  <line x1="350" y1="245" x2="408" y2="245" stroke="#B25E09" stroke-width="2" marker-end="url(#a)" />
  <text x="380" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#B25E09">KV</text>
  <text x="380" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#B25E09">RDMA</text>
  <line x1="380" y1="106" x2="185" y2="148" stroke="#6f6f6f" stroke-width="2" marker-end="url(#a)" />
  <line x1="380" y1="106" x2="575" y2="148" stroke="#6f6f6f" stroke-width="2" marker-end="url(#a)" />
  <rect x="20" y="360" width="720" height="44" rx="8" fill="#fdf1e3" stroke="#B25E09" />
  <text x="380" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#313131">Una release de Helm: values.yaml con un bloque de prefill, otro de decode y otro de router</text>
  <text x="380" y="396" text-anchor="middle" font-size="11" font-weight="400" fill="#6f6f6f">Red InfiniBand o RoCE entre los nodos GPU</text>
</svg>
